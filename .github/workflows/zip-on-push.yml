name: Zip Source Code on Push

on:
  push:
    branches:
      - '**'

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Filename and Zip
        run: |
          # Buat format nama: ddmmyy-HHMM-xxxx.zip (xxxx = 4 karakter hex acak)
          TIMESTAMP=$(date +"%d%m%y-%H%M")
          RANDOM_STR=$(openssl rand -hex 2)
          FILENAME="${TIMESTAMP}-${RANDOM_STR}.zip"
          
          # Zip semua berkas, kecualikan direktori .git agar tidak membengkak
          zip -r "$FILENAME" . -x "*.git*"
          
          # Simpan nama berkas ke environment variable GitHub
          echo "ZIP_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_FILENAME }}
          path: ${{ env.ZIP_FILENAME }}
          retention-days: 14
