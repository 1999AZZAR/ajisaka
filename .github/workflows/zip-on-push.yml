name: Zip Source Code on Push

on:
  push:
    branches:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web App & Sync Capacitor
        run: |
          cd src
          npm install
          npm run build
          npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Assets and SHAs
        run: |
          # Buat format nama: ddmmyy-HHMM-xxxx
          TIMESTAMP=$(date +"%d%m%y-%H%M")
          RANDOM_STR=$(openssl rand -hex 2)
          BASE_NAME="${TIMESTAMP}-${RANDOM_STR}"
          ZIP_FILENAME="${BASE_NAME}.zip"
          APK_FILENAME="${BASE_NAME}.apk"
          SHA_FILENAME="${BASE_NAME}.sha256"
          
          # Zip source code
          zip -r "$ZIP_FILENAME" . -x "*.git*"
          
          # Pindahkan APK hasil build
          cp src/android/app/build/outputs/apk/debug/app-debug.apk "$APK_FILENAME"
          
          # Hasilkan SHA-256 checksum untuk kedua file
          sha256sum "$ZIP_FILENAME" "$APK_FILENAME" > "$SHA_FILENAME"
          
          # Ekspor variabel
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
          echo "ZIP_FILENAME=$ZIP_FILENAME" >> $GITHUB_ENV
          echo "APK_FILENAME=$APK_FILENAME" >> $GITHUB_ENV
          echo "SHA_FILENAME=$SHA_FILENAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BASE_NAME }}
          name: Build ${{ env.BASE_NAME }}
          body: |
            Automated build and snapshot for commit ${{ github.sha }}.
            
            ### Build Details
            - **Commit**: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Branch**: `${{ github.ref_name }}`
            - **Triggered by**: @${{ github.actor }}
            
            ### Downloadable Assets
            - Android Application (`.apk`)
            - Source code archive (`.zip`)
            - SHA-256 checksum file (`.sha256`) for integrity verification
          files: |
            ${{ env.ZIP_FILENAME }}
            ${{ env.APK_FILENAME }}
            ${{ env.SHA_FILENAME }}
