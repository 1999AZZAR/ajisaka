server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the service worker or entry HTML, so SW updates propagate
    location ~ ^/sw[^/]*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Hashed assets (index-<hash>.js/css, workbox-<hash>.js) are immutable
    location ~* -[A-Za-z0-9_-]+\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest should be revalidated
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires 1h;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
